<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Limoncito Culichi - Menú Imprimible Papelería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #212529;
      font-family: 'Montserrat', sans-serif;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .top-notice {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      font-size: 13px;
      font-weight: 700;
      color: #333333;
    }
    .top-notice span {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-ok {
      background: #28a745;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .menu-page-wrapper {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .menu-page-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ═══════════════════════════════════════════════════════════════
       REGLAS ESTRICTAS DE IMPRESIÓN PARA PAPELERÍA (DIRECT TO PDF)
       ═══════════════════════════════════════════════════════════════ */
    @media print {
      @page {
        size: letter portrait;
        margin: 0;
      }
      body {
        background: #ffffff !important;
        padding: 0 !important;
        gap: 0 !important;
      }
      .top-notice {
        display: none !important;
      }
      .menu-page-wrapper {
        border-radius: 0 !important;
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100% !important;
        height: 100vh !important;
        page-break-after: always !important;
        break-after: page !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: #ffffff !important;
      }
      .menu-page-wrapper:last-child {
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .menu-page-img {
        width: 100% !important;
        height: 100% !important;
        object-fit: fill !important;
      }
    }

    @media screen and (max-width: 600px) {
      body {
        padding: 10px 4px;
        gap: 16px;
      }
      .top-notice {
        flex-direction: column;
        gap: 8px;
        text-align: center;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="top-notice">
    <span>
      <span class="badge-ok">Listo para Papelería</span>
      Las 6 Hojas Originales Limpias, Encuadradas y sin Arillos
    </span>
    <span style="color: #666; font-size: 11px;">Presiona Ctrl + P para guardar PDF o imprimir</span>
  </div>

  <!-- PÁGINA 1: ENTRADAS & OSTRAS -->
  <div class="menu-page-wrapper">
    <img src="img/carta_01_entradas.jpg" alt="Página 1: Entradas y Ostras" class="menu-page-img">
  </div>

  <!-- PÁGINA 2: AGUACHILES & COCTELES -->
  <div class="menu-page-wrapper">
    <img src="img/carta_02_aguachiles.jpg" alt="Página 2: Aguachiles y Cocteles Especiales" class="menu-page-img">
  </div>

  <!-- PÁGINA 3: CEVICHES -->
  <div class="menu-page-wrapper">
    <img src="img/carta_03_ceviches.jpg" alt="Página 3: Ceviches" class="menu-page-img">
  </div>

  <!-- PÁGINA 4: ROLLOS FRÍOS -->
  <div class="menu-page-wrapper">
    <img src="img/carta_04_rollos_frios.jpg" alt="Página 4: Rollos Fríos" class="menu-page-img">
  </div>

  <!-- PÁGINA 5: ROLLOS EMPANIZADOS & EXTRAS -->
  <div class="menu-page-wrapper">
    <img src="img/carta_05_rollos_empanizados.jpg" alt="Página 5: Rollos Empanizados" class="menu-page-img">
  </div>

  <!-- PÁGINA 6: EXTRAS MARISCOS & BEBIDAS -->
  <div class="menu-page-wrapper">
    <img src="img/carta_06_extras_bebidas.jpg" alt="Página 6: Extras Mariscos y Bebidas" class="menu-page-img">
  </div>

</body>
</html>
