<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Satisfy&family=Yellowtail&family=Montserrat:wght@800;900&family=Oswald:wght@700&display=swap');
  
  body { 
    margin: 0; 
    background: #222; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }
  
  .sheet {
    width: 816px;
    height: 1080px;
    background-color: #FFFFFF;
    background-image: url('img/bg_fan_pattern.svg');
    background-repeat: repeat;
    background-size: 130px 96px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 42px 20px 38px 20px;
    font-family: 'Montserrat', sans-serif;
    position: relative;
    overflow: hidden;
  }
  
  .top-title {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 16px;
    color: #243342;
    text-transform: uppercase;
    padding-left: 16px;
    text-align: center;
    text-shadow: 2.5px 2.5px 0 #FFF, -2.5px -2.5px 0 #FFF, 2.5px -2.5px 0 #FFF, -2.5px 2.5px 0 #FFF, 0 3px 8px rgba(255,255,255,0.95);
    z-index: 2;
  }

  .badge-container {
    width: 740px;
    height: 660px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  .badge-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Cursive Orange Mexican font wrapping over hat */
  .curved-orange-text {
    font-family: 'Pacifico', cursive;
    font-size: 52px;
    fill: #FF7018;
    stroke: #182230;
    stroke-width: 9px;
    paint-order: stroke fill;
    stroke-linejoin: round;
    stroke-linecap: round;
    letter-spacing: 1px;
  }

  .curved-orange-inner {
    font-family: 'Pacifico', cursive;
    font-size: 52px;
    fill: #FFA100;
    letter-spacing: 1px;
  }

  .curved-bot-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 21px;
    font-weight: 900;
    fill: #144B5B;
    stroke: #FFFFFF;
    stroke-width: 6px;
    paint-order: stroke fill;
    stroke-linejoin: round;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .bot-title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 24px;
    color: #111827;
    text-transform: uppercase;
    line-height: 1.25;
    padding-left: 24px;
    text-align: center;
    text-shadow: 2.5px 2.5px 0 #FFF, -2.5px -2.5px 0 #FFF, 2.5px -2.5px 0 #FFF, -2.5px 2.5px 0 #FFF, 0 4px 10px rgba(255,255,255,0.95);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="top-title">MARISCOS Y SUSHI</div>
    
    <div class="badge-container">
      <svg class="badge-svg" viewBox="0 0 740 660">
        <defs>
          <!-- Arched curve hugging snugly over the cowboy hat -->
          <path id="top-curve" d="M 50,310 A 335,250 0 0,1 690,310" fill="none" />
          
          <!-- Arched curve along the bottom of the waves -->
          <path id="bot-curve" d="M 195,430 A 210,210 0 0,0 545,430" fill="none" />
          
          <!-- Soft radial glow behind emblem fading into the diamond pattern -->
          <radialGradient id="halo-glow" cx="50%" cy="48%" r="48%">
            <stop offset="65%" stop-color="#FFFFFF" stop-opacity="1" />
            <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
          </radialGradient>

          <filter id="badge-shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.20" />
          </filter>
        </defs>

        <!-- White radial vignette behind emblem -->
        <circle cx="370" cy="315" r="305" fill="url(#halo-glow)" />

        <!-- Mascot Artwork in Center (High-Res Digital & Flipped to match physical menu) -->
        <g filter="url(#badge-shadow)">
          <image href="img/logo_mascot_clean.png" x="60" y="70" width="620" height="520" />
        </g>

        <!-- Authentic Nautical Ocean Waves & Ribbon under lime chin and shrimps -->
        <g id="authentic-waves" filter="url(#badge-shadow)">
          <!-- 1. Deep Ocean Swell Base -->
          <path d="M 182,410 
                   C 215,385 250,408 285,390 
                   C 320,380 355,406 390,390 
                   C 425,380 460,408 495,390 
                   C 525,385 550,405 558,418 
                   A 214,214 0 0,1 182,410 Z" fill="#134C5E" />

          <!-- 2. Mid Turquoise Wave Body -->
          <path d="M 186,416 
                   C 220,394 255,414 290,396 
                   C 325,386 360,412 395,396 
                   C 430,386 465,412 500,396 
                   C 525,392 546,408 554,422 
                   A 208,208 0 0,1 186,416 Z" fill="#248FAE" />

          <!-- 3. Dynamic Wave Highlights -->
          <path d="M 210,424 Q 260,408 310,426 Q 360,412 410,426 Q 460,410 520,424" stroke="#4BC2E0" stroke-width="2.5" fill="none" stroke-linecap="round" />
          <path d="M 235,434 Q 285,420 340,435 Q 395,422 450,435 Q 485,426 510,432" stroke="#103F4E" stroke-width="2" fill="none" stroke-linecap="round" />

          <!-- 4. Left Crashing Surf & Foam (curling under left shrimp) -->
          <path d="M 182,410 
                   C 192,390 212,382 228,390 
                   C 238,378 256,375 270,386 
                   C 280,394 274,404 292,400 
                   C 305,397 312,410 320,414 
                   C 298,410 285,420 264,416 
                   C 242,412 225,422 182,410 Z" fill="#FFFFFF" />
          <!-- Foam curls & spray -->
          <path d="M 226,390 Q 235,380 244,386" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
          <circle cx="218" cy="382" r="2.5" fill="#FFFFFF" />
          <circle cx="236" cy="374" r="2" fill="#FFFFFF" />
          <circle cx="254" cy="372" r="2.5" fill="#FFFFFF" />
          <circle cx="272" cy="378" r="2" fill="#FFFFFF" />

          <!-- 5. Center Foam Breaker (under lime smile) -->
          <path d="M 315,404 
                   C 328,388 344,396 356,388 
                   C 368,380 376,394 388,388 
                   C 400,382 410,396 422,402 
                   C 405,398 392,410 374,404 
                   C 356,410 340,398 315,404 Z" fill="#FFFFFF" />
          <circle cx="346" cy="382" r="2" fill="#FFFFFF" />
          <circle cx="368" cy="376" r="2.5" fill="#FFFFFF" />
          <circle cx="396" cy="380" r="2" fill="#FFFFFF" />

          <!-- 6. Right Crashing Surf & Foam (curling under right shrimp) -->
          <path d="M 558,418 
                   C 548,392 528,382 512,390 
                   C 502,378 484,375 470,386 
                   C 460,394 466,404 448,400 
                   C 435,397 428,410 420,414 
                   C 442,410 455,420 476,416 
                   C 498,412 515,422 558,418 Z" fill="#FFFFFF" />
          <!-- Foam curls & spray -->
          <path d="M 514,390 Q 505,380 496,386" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
          <circle cx="522" cy="382" r="2.5" fill="#FFFFFF" />
          <circle cx="504" cy="374" r="2" fill="#FFFFFF" />
          <circle cx="486" cy="372" r="2.5" fill="#FFFFFF" />
          <circle cx="468" cy="378" r="2" fill="#FFFFFF" />

        </g>

        <!-- Shrimps Rendered ON TOP of Surf so they swim gracefully above the water -->
        <g filter="url(#badge-shadow)">
          <image href="img/shrimp_left.png" x="141.5" y="337.8" width="155.8" height="107.1" />
          <image href="img/shrimp_right.png" x="449.7" y="337.8" width="155.8" height="107.1" />
        </g>

        <!-- Arched Cursive Orange Text: El Limoncito Culichi wrapping around lime hat -->
        <text class="curved-orange-text">
          <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
            El Limoncito Culichi
          </textPath>
        </text>
        <text class="curved-orange-inner">
          <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
            El Limoncito Culichi
          </textPath>
        </text>

        <!-- Arched Bottom Text: CEVICHE & AGUACHILE inside the white ribbon -->
        <text class="curved-bot-text">
          <textPath href="#bot-curve" startOffset="50%" text-anchor="middle">
            CEVICHE &amp; AGUACHILE
          </textPath>
        </text>
      </svg>
    </div>

    <div class="bot-title">ESTILO<br>SINALOA</div>
  </div>
</body>
</html>
