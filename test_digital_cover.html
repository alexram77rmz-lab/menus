<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@800;900&family=Oswald:wght@700&display=swap');
  
  body { 
    margin: 0; 
    background: #222; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }
  
  .sheet {
    width: 816px;
    height: 1080px;
    background-color: #FFFFFF;
    background-image: url('img/bg_fan_pattern.svg');
    background-repeat: repeat;
    background-size: 130px 96px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 42px 20px 38px 20px;
    font-family: 'Montserrat', sans-serif;
    position: relative;
    overflow: hidden;
  }
  
  .top-title {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 16px;
    color: #243342;
    text-transform: uppercase;
    padding-left: 16px;
    text-align: center;
    text-shadow: 2.5px 2.5px 0 #FFF, -2.5px -2.5px 0 #FFF, 2.5px -2.5px 0 #FFF, -2.5px 2.5px 0 #FFF, 0 3px 8px rgba(255,255,255,0.95);
    z-index: 2;
  }

  .badge-container {
    width: 740px;
    height: 680px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  .badge-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Cursive Orange Mexican font wrapping from palm to palm */
  .curved-orange-text {
    font-family: 'Pacifico', cursive;
    font-size: 50px;
    fill: #FF7018;
    stroke: #182230;
    stroke-width: 9px;
    paint-order: stroke fill;
    stroke-linejoin: round;
    stroke-linecap: round;
    letter-spacing: 1px;
  }

  .curved-orange-inner {
    font-family: 'Pacifico', cursive;
    font-size: 50px;
    fill: #FFA100;
    letter-spacing: 1px;
  }

  .bot-title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 24px;
    color: #111827;
    text-transform: uppercase;
    line-height: 1.25;
    padding-left: 24px;
    text-align: center;
    text-shadow: 2.5px 2.5px 0 #FFF, -2.5px -2.5px 0 #FFF, 2.5px -2.5px 0 #FFF, -2.5px 2.5px 0 #FFF, 0 4px 10px rgba(255,255,255,0.95);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="top-title">MARISCOS Y SUSHI</div>
    
    <div class="badge-container">
      <svg class="badge-svg" viewBox="0 -40 740 720">
        <defs>
          <!-- Curva superior arqueada en forma de medio arcoíris rodeando el logotipo hacia arriba -->
          <path id="top-curve" d="M 95,250 A 280,230 0 0,1 645,250" fill="none" />
          
          <linearGradient id="ocean-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#55D4F2" />
            <stop offset="50%" stop-color="#30BDE0" />
            <stop offset="100%" stop-color="#18A5CA" />
          </linearGradient>

          <filter id="badge-shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.20" />
          </filter>
        </defs>

        <!-- Arte del Limoncito Vaquero en el centro -->
        <g filter="url(#badge-shadow)">
          <image href="img/logo_mascot_clean.png" x="60" y="80" width="620" height="520" />
        </g>

        <!-- 1. Fondo de agua marina en la base circular del emblema (azul claro tropical oficial) -->
        <g id="ocean-base" filter="url(#badge-shadow)">
          <path d="M 190,410 
                   A 190,190 0 0,0 550,410 
                   L 550,395 
                   C 500,408 440,412 370,412 
                   C 300,412 240,408 190,395 Z" fill="url(#ocean-grad)" />
          <path d="M 190,410 A 190,190 0 0,0 550,410" fill="none" stroke="#167A99" stroke-width="3.5" />
        </g>

        <!-- 2. LAS DOS OLAS AUTÉNTICAS (Color azul clarito del logotipo original) -->
        <g id="two-authentic-waves" filter="url(#badge-shadow)">
          <!-- OLA IZQUIERDA -->
          <path d="M 190,405 
                   C 230,420 270,422 310,410 
                   C 330,404 345,394 350,386 
                   C 342,380 330,390 318,398 
                   C 285,410 240,412 190,405 Z" fill="#30BDE0" stroke="#167A99" stroke-width="2.2" stroke-linejoin="round" />
          
          <!-- Espuma blanca con rizo de ola izquierda -->
          <path d="M 255,406 
                   C 280,410 305,404 324,394 
                   C 334,388 348,386 352,392 
                   C 348,400 336,404 322,406 
                   C 302,409 276,409 255,406 Z" fill="#FFFFFF" stroke="#167A99" stroke-width="1.8" stroke-linejoin="round" />
          
          <!-- Líneas de corriente izquierda -->
          <path d="M 220,410 Q 270,416 318,404" fill="none" stroke="#8AE4FA" stroke-width="2.2" stroke-linecap="round" />
          <path d="M 240,415 Q 282,419 320,410" fill="none" stroke="#136A85" stroke-width="2" stroke-linecap="round" />

          <!-- OLA DERECHA -->
          <path d="M 550,405 
                   C 510,420 470,422 430,410 
                   C 410,404 395,394 390,386 
                   C 398,380 410,390 422,398 
                   C 455,410 500,412 550,405 Z" fill="#30BDE0" stroke="#167A99" stroke-width="2.2" stroke-linejoin="round" />
          
          <!-- Espuma blanca con rizo de ola derecha -->
          <path d="M 485,406 
                   C 460,410 435,404 416,394 
                   C 406,388 392,386 388,392 
                   C 392,400 404,404 418,406 
                   C 438,409 464,409 485,406 Z" fill="#FFFFFF" stroke="#167A99" stroke-width="1.8" stroke-linejoin="round" />

          <!-- Líneas de corriente derecha -->
          <path d="M 520,410 Q 470,416 422,404" fill="none" stroke="#8AE4FA" stroke-width="2.2" stroke-linecap="round" />
          <path d="M 500,415 Q 458,419 420,410" fill="none" stroke="#136A85" stroke-width="2" stroke-linecap="round" />

          <!-- Conector de espuma bajo la barbilla central -->
          <path d="M 330,400 C 348,394 360,393 370,393 C 380,393 392,394 410,400 C 392,404 370,405 348,404 Z" fill="#FFFFFF" stroke="#167A99" stroke-width="1.8" stroke-linejoin="round" />
        </g>

        <!-- Camarones encima del agua -->
        <g filter="url(#badge-shadow)">
          <image href="img/shrimp_left.png" x="141.5" y="337.8" width="155.8" height="107.1" />
          <image href="img/shrimp_right.png" x="449.7" y="337.8" width="155.8" height="107.1" />
        </g>

        <!-- Letras Naranjas Arqueadas: El Limoncito Culichi rodeando el sombrero -->
        <text class="curved-orange-text">
          <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
            El Limoncito Culichi
          </textPath>
        </text>
        <text class="curved-orange-inner">
          <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
            El Limoncito Culichi
          </textPath>
        </text>
      </svg>
    </div>

    <div class="bot-title">ESTILO<br>SINALOA</div>
  </div>
</body>
</html>
