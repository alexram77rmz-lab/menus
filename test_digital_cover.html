<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@800;900&family=Oswald:wght@700&display=swap');
  
  body { 
    margin: 0; 
    background: #222; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
  }
  
  .sheet {
    width: 816px;
    height: 1080px;
    background-color: #FFFFFF;
    background-image: url('img/bg_fan_pattern.svg');
    background-repeat: repeat;
    background-size: 130px 96px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 42px 20px 38px 20px;
    font-family: 'Montserrat', sans-serif;
    position: relative;
    overflow: hidden;
  }
  
  .top-title {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 16px;
    color: #243342;
    text-transform: uppercase;
    padding-left: 16px;
    text-align: center;
    text-shadow: 2.5px 2.5px 0 #FFF, -2.5px -2.5px 0 #FFF, 2.5px -2.5px 0 #FFF, -2.5px 2.5px 0 #FFF, 0 3px 8px rgba(255,255,255,0.95);
    z-index: 2;
  }

  .badge-container {
    width: 740px;
    height: 680px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  .badge-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Cursive Orange Mexican font wrapping from palm to palm */
  .curved-orange-text {
    font-family: 'Pacifico', cursive;
    font-size: 50px;
    fill: #FF7018;
    stroke: #182230;
    stroke-width: 9px;
    paint-order: stroke fill;
    stroke-linejoin: round;
    stroke-linecap: round;
    letter-spacing: 1px;
  }

  .curved-orange-inner {
    font-family: 'Pacifico', cursive;
    font-size: 50px;
    fill: #FFA100;
    letter-spacing: 1px;
  }

  .bot-title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 24px;
    color: #111827;
    text-transform: uppercase;
    line-height: 1.25;
    padding-left: 24px;
    text-align: center;
    text-shadow: 2.5px 2.5px 0 #FFF, -2.5px -2.5px 0 #FFF, 2.5px -2.5px 0 #FFF, -2.5px 2.5px 0 #FFF, 0 4px 10px rgba(255,255,255,0.95);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="top-title">MARISCOS Y SUSHI</div>
    
    <div class="badge-container">
      <svg class="badge-svg" viewBox="0 -40 740 720">
        <defs>
          <!-- Curva superior arqueada en forma de medio arcoíris rodeando el logotipo hacia arriba -->
          <path id="top-curve" d="M 95,250 A 280,230 0 0,1 645,250" fill="none" />
          
          <linearGradient id="ocean-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8CE8FC" />
            <stop offset="50%" stop-color="#4ED5F6" />
            <stop offset="100%" stop-color="#28C2E7" />
          </linearGradient>

          <filter id="badge-shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.20" />
          </filter>
        </defs>

        <!-- Arte del Limoncito Vaquero en el centro (Sin agua artificial, limpio y auténtico) -->
        <g filter="url(#badge-shadow)">
          <image href="img/logo_mascot_clean_official_v2.png" x="60" y="80" width="620" height="520" />
        </g>

        <!-- Letras Naranjas Arqueadas: El Limoncito Culichi rodeando el sombrero -->
        <text class="curved-orange-text">
          <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
            El Limoncito Culichi
          </textPath>
        </text>
        <text class="curved-orange-inner">
          <textPath href="#top-curve" startOffset="50%" text-anchor="middle">
            El Limoncito Culichi
          </textPath>
        </text>
      </svg>
    </div>

    <div class="bot-title">ESTILO<br>SINALOA</div>
  </div>
</body>
</html>
