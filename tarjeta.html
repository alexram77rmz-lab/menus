<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alex Ramírez · Tarjeta Digital & QR | MenuExpress México</title>
  <meta name="description" content="Carta de presentación y código QR digital de Alex Ramírez - MenuExpress México. Soluciones tecnológicas, menús digitales y placas NFC para restaurantes.">
  <meta name="theme-color" content="#ffffff">

  <!-- OpenGraph -->
  <meta property="og:title" content="Alex Ramírez · MenuExpress México">
  <meta property="og:description" content="Menús digitales interactivos y placas NFC para restaurantes en México.">
  <meta property="og:image" content="images/qr_menuexpress_minimal_white.png">

  <!-- Tipografías: Plus Jakarta Sans, Space Grotesk y Playfair Display (cursiva M) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-subtle: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --whatsapp: #25d366;
      --whatsapp-hover: #1ebd5a;
      --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --heading: 'Space Grotesk', sans-serif;
      --serif: 'Playfair Display', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      line-height: 1.5;
    }

    /* Tarjeta Blanca Minimalista */
    .stand-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 40px 28px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
      animation: cardFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo Minimalista: M negra en cursiva dentro de círculo de contraste */
    .logo-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    .logo-letter {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 700;
      font-size: 2.85rem;
      color: #0f172a;
      line-height: 1;
      transform: translateY(-2px);
    }

    /* Nombre y Datos */
    .founder-name {
      font-family: var(--heading);
      font-size: 1.85rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .brand-kicker {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .founder-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* Contenedor del Código QR */
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 22px;
      border: 2px dashed var(--border-subtle);
      display: inline-block;
      margin: 0 auto 14px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .qr-box:hover {
      border-color: #0f172a;
      transform: scale(1.01);
    }

    .qr-image {
      width: 220px;
      height: 220px;
      display: block;
      border-radius: 12px;
    }

    .scan-note {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .scan-note strong {
      color: #0f172a;
    }

    /* Botones de Acción Directa */
    .actions-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 16px;
      font-size: 0.90rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: var(--sans);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
    }

    .btn-whatsapp:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(37, 211, 102, 0.45);
    }

    .btn-website {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.15);
    }

    .btn-website:hover {
      background: #1e293b;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(15, 23, 42, 0.25);
    }

    .btn-demo {
      background: #ffffff;
      border: 1px solid var(--border);
      color: #0f172a;
    }

    .btn-demo:hover {
      background: #f8fafc;
      border-color: #0f172a;
      transform: translateY(-2px);
    }

    /* Footer de la tarjeta */
    .card-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-light);
    }

    .share-link-btn {
      background: none;
      border: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.74rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--sans);
    }

    .share-link-btn:hover {
      text-decoration: underline;
    }

    /* Modo Impresión Limpio */
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .stand-card {
        box-shadow: none;
        border: 1px solid #cbd5e1;
        margin: 0 auto;
      }
      .actions-group, .card-footer {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <main class="stand-card">
    <!-- Círculo de Contraste con M Negra en Cursiva -->
    <div class="logo-circle" aria-label="Logo M">
      <span class="logo-letter">M</span>
    </div>

    <!-- Nombre y Título -->
    <h1 class="founder-name">Alex Ramírez</h1>
    <span class="brand-kicker">MenuExpress México</span>
    <p class="founder-subtitle">
      Menús Digitales Interactivos · Placas QR & NFC
    </p>

    <!-- Código QR Blanco Minimalista -->
    <div class="qr-box">
      <img src="images/qr_menuexpress_minimal_white.png" alt="Código QR Alex Ramírez MenuExpress" class="qr-image">
    </div>

    <p class="scan-note">
      Apunta con la cámara de tu celular para abrir el portal y cotizaciones.
    </p>

    <!-- Botones de Acción Directa -->
    <div class="actions-group">
      <a href="https://wa.me/523312345678?text=Hola%20Alex!%20Escane%C3%A9%20tu%20tarjeta%20digital%20y%20me%20gustar%C3%ADa%20cotizar%20un%20men%C3%BA%20digital" target="_blank" class="btn-action btn-whatsapp">
        <span>💬</span> WhatsApp Directo
      </a>
      <a href="index.html" class="btn-action btn-website">
        <span>🌐</span> Abrir Web & Cotizador
      </a>
      <a href="alex/" class="btn-action btn-demo">
        <span>🥩</span> Probar Menú Demo (ALEX)
      </a>
    </div>

    <!-- Pie con Compartir -->
    <div class="card-footer">
      <span>MenuExpress · 2026</span>
      <button type="button" class="share-link-btn" onclick="shareCard()">
        <span>🔗</span> Compartir
      </button>
    </div>
  </main>

  <script>
    function shareCard() {
      if (navigator.share) {
        navigator.share({
          title: 'Alex Ramírez · MenuExpress México',
          text: 'Conoce las cartas digitales interactivas y placas NFC para restaurantes de Alex Ramírez:',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('✓ Enlace copiado al portapapeles');
      }
    }
  </script>

</body>
</html>
