<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>ALEX · Menú 3D & Realidad Aumentada</title>
  <meta name="description" content="Explora nuestros platillos en 3D y visualízalos en tu mesa con Realidad Aumentada. ALEX Artisanal Grill & Smokehouse.">
  <meta property="og:title" content="ALEX · Menú 3D & AR Experience">
  <meta property="og:description" content="Experiencia gastronómica inmersiva: ve cada platillo en 3D y proyéctalo en tu mesa con AR.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1544025162-d76694265947?w=1200&auto=format&fit=crop&q=85">
  <meta name="theme-color" content="#08080a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3L5 27H11L13.5 21H18.5L21 27H27L16 3Z' fill='%23f59e0b'/%3E%3Cpath d='M16 11L14.4 16.5H17.6L16 11Z' fill='%2308080a'/%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Google Model Viewer v4.3.1 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════════
       CSS VARIABLES & RESET
    ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg-primary: #08080a;
      --bg-secondary: #0f0f14;
      --bg-card: #16161e;
      --bg-elevated: #1c1c28;
      --bg-glass: rgba(22, 22, 30, 0.85);

      --neon-amber: #f59e0b;
      --neon-amber-50: rgba(245, 158, 11, 0.5);
      --neon-amber-20: rgba(245, 158, 11, 0.2);
      --neon-amber-10: rgba(245, 158, 11, 0.1);
      --crimson: #ef4444;
      --emerald: #10b981;
      --emerald-20: rgba(16, 185, 129, 0.2);

      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-glow: rgba(245, 158, 11, 0.3);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --display: 'Space Grotesk', var(--sans);

      --shadow-glow: 0 0 20px rgba(245, 158, 11, 0.15), 0 0 60px rgba(245, 158, 11, 0.05);
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
      --shadow-elevated: 0 8px 40px rgba(0, 0, 0, 0.6);

      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ═══════════════════════════════════════════════════════════════
       PRELOADER
    ═══════════════════════════════════════════════════════════════ */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-logo {
      font-family: var(--display);
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--neon-amber);
      text-shadow: 0 0 30px var(--neon-amber-50);
    }
    .preloader-bar {
      width: 200px;
      height: 3px;
      background: var(--bg-elevated);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .preloader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-amber), #fbbf24);
      border-radius: var(--radius-full);
      animation: preloaderFill 2s ease-out forwards;
    }
    @keyframes preloaderFill {
      to { width: 100%; }
    }
    .preloader-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ═══════════════════════════════════════════════════════════════
       LAYOUT
    ═══════════════════════════════════════════════════════════════ */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 100vw;
    }

    /* ═══════════════════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════════════════ */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-back {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-fast);
      text-decoration: none;
    }
    .header-back:hover {
      border-color: var(--neon-amber);
      color: var(--neon-amber);
      box-shadow: var(--shadow-glow);
    }
    .header-brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      color: var(--neon-amber);
    }
    .header-subtitle {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .header-badge {
      background: linear-gradient(135deg, var(--neon-amber), #fbbf24);
      color: var(--bg-primary);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ═══════════════════════════════════════════════════════════════
       CATEGORY NAV
    ═══════════════════════════════════════════════════════════════ */
    .category-nav {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-chip {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition-smooth);
      white-space: nowrap;
    }
    .category-chip:hover {
      border-color: var(--neon-amber-50);
      color: var(--text-primary);
    }
    .category-chip.active {
      background: linear-gradient(135deg, var(--neon-amber), #fbbf24);
      color: var(--bg-primary);
      border-color: transparent;
      font-weight: 700;
      box-shadow: 0 0 20px var(--neon-amber-20);
    }

    /* ═══════════════════════════════════════════════════════════════
       3D VIEWER SECTION
    ═══════════════════════════════════════════════════════════════ */
    .viewer-section {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 55vh;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, var(--bg-primary) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient glow behind model */
    .viewer-section::before {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--neon-amber-20) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      z-index: 1;
      outline: none;
    }
    model-viewer::part(default-progress-bar) {
      display: none;
    }

    /* Custom Loading Overlay */
    .viewer-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      background: rgba(8, 8, 10, 0.7);
      backdrop-filter: blur(10px);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .viewer-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--bg-elevated);
      border-top-color: var(--neon-amber);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Dish Info Overlay */
    .dish-info-overlay {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
    }
    .dish-info-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dish-info-name {
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }
    .dish-info-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      max-width: 260px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.7);
      line-height: 1.4;
    }
    .dish-info-price {
      font-family: var(--display);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--neon-amber);
      text-shadow: 0 0 20px var(--neon-amber-50);
      pointer-events: auto;
    }

    /* ═══════════════════════════════════════════════════════════════
       HOTSPOT STYLES
    ═══════════════════════════════════════════════════════════════ */
    .hotspot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--neon-amber);
      background: var(--neon-amber-20);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: var(--transition-fast);
    }
    .hotspot::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--neon-amber);
      animation: hotspotPulse 2s ease-out infinite;
    }
    @keyframes hotspotPulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .hotspot-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-amber);
      box-shadow: 0 0 8px var(--neon-amber);
    }

    /* Hotspot Annotation Card */
    .hotspot-annotation {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      min-width: 160px;
      max-width: 220px;
      box-shadow: var(--shadow-elevated);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: var(--transition-smooth);
      z-index: 20;
    }
    .hotspot-annotation.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .hotspot-annotation-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--neon-amber);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .hotspot-annotation-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    /* Triangle pointer */
    .hotspot-annotation::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--bg-card);
    }

    /* ═══════════════════════════════════════════════════════════════
       AR FLOATING BUTTON
    ═══════════════════════════════════════════════════════════════ */
    .ar-fab {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      border: none;
      background: linear-gradient(135deg, var(--neon-amber), #fbbf24);
      color: var(--bg-primary);
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 20px var(--neon-amber-50);
      transition: var(--transition-spring);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .ar-fab:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 30px var(--neon-amber-50);
    }
    .ar-fab:active {
      transform: scale(0.97);
    }
    .ar-fab svg {
      width: 18px;
      height: 18px;
    }

    /* ═══════════════════════════════════════════════════════════════
       DISH CAROUSEL
    ═══════════════════════════════════════════════════════════════ */
    .carousel-section {
      padding: 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-subtle);
    }
    .carousel-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }
    .carousel-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 4px;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .carousel-item {
      flex-shrink: 0;
      width: 110px;
      cursor: pointer;
      scroll-snap-align: start;
      border-radius: var(--radius-md);
      border: 2px solid transparent;
      background: var(--bg-card);
      padding: 8px;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .carousel-item:hover {
      border-color: var(--neon-amber-20);
      transform: translateY(-2px);
    }
    .carousel-item.active {
      border-color: var(--neon-amber);
      box-shadow: 0 0 20px var(--neon-amber-20);
    }
    .carousel-thumb {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel-thumb model-viewer {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .carousel-thumb-emoji {
      font-size: 2.2rem;
    }
    .carousel-item-name {
      font-size: 0.72rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .carousel-item-price {
      font-size: 0.68rem;
      color: var(--neon-amber);
      font-weight: 700;
    }

    /* ═══════════════════════════════════════════════════════════════
       ACTION BAR (Add to Order)
    ═══════════════════════════════════════════════════════════════ */
    .action-bar {
      position: sticky;
      bottom: 0;
      z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border-top: 1px solid var(--border-subtle);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .action-qty {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .action-qty-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
    }
    .action-qty-btn:hover {
      background: var(--neon-amber-10);
      color: var(--neon-amber);
    }
    .action-qty-btn:active {
      background: var(--neon-amber-20);
    }
    .action-qty-count {
      width: 32px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .action-add-btn {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--neon-amber), #fbbf24);
      color: var(--bg-primary);
      font-family: var(--sans);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition-spring);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .action-add-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px var(--neon-amber-50);
    }
    .action-add-btn:active {
      transform: scale(0.98);
    }
    .action-total {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 70px;
    }
    .action-total-label {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .action-total-value {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--neon-amber);
    }

    /* ═══════════════════════════════════════════════════════════════
       TOAST NOTIFICATION
    ═══════════════════════════════════════════════════════════════ */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 12px 24px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: var(--shadow-elevated);
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .toast-icon {
      font-size: 1.2rem;
    }

    /* ═══════════════════════════════════════════════════════════════
       ORDER DRAWER
    ═══════════════════════════════════════════════════════════════ */
    .order-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-smooth);
    }
    .order-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .order-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 501;
      max-height: 80vh;
      background: var(--bg-secondary);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
    }
    .order-drawer.open {
      transform: translateY(0);
    }
    .order-drawer-handle {
      width: 40px;
      height: 4px;
      background: var(--text-muted);
      border-radius: var(--radius-full);
      margin: 12px auto 0;
    }
    .order-drawer-header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }
    .order-drawer-title {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
    }
    .order-drawer-close {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;

      modelGlb: `${KHRONOS_BASE}/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb`,
      modelUsdz: '',
      cameraOrbit: '160deg 75deg 0.2m',
      cameraTarget: '0m 0.05m 0m',

      hotspots: [

  // ═══════════════════════════════════════════════════════════════

  let currentDishIndex = 0;

  let activeCategory = 'all';
  let openHotspot = null;

  // ═══════════════════════════════════════════════════════════════
  // DOM REFS
  // ═══════════════════════════════════════════════════════════════
  const viewer       = document.getElementById('mainViewer');

  const toastText    = document.getElementById('toastText');
  const orderOverlay = document.getElementById('orderOverlay');
  const orderDrawer  = document.getElementById('orderDrawer');
  const orderBody    = document.getElementById('orderBody');
  const orderTotalV  = document.getElementById('orderTotalValue');
  const orderClose   = document.getElementById('orderClose');
  const orderConfirm = document.getElementById('orderConfirmBtn');
  const categoryNav  = document.getElementById('categoryNav');

  // ═══════════════════════════════════════════════════════════════
  // PRELOADER
  // ═══════════════════════════════════════════════════════════════
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('preloader').classList.add('hidden');
    }, 1800);
  });

  // ═══════════════════════════════════════════════════════════════
  // RENDER VIEWER — updates 3D model, info, hotspots
  // ═══════════════════════════════════════════════════════════════
  function renderViewer(dish, animate = true) {
    // Show loading
    viewerLoad.classList.remove('hidden');

    // Update model source
    viewer.setAttribute('src', dish.modelGlb);
    if (dish.modelUsdz) {
      viewer.setAttribute('ios-src', dish.modelUsdz);
    } else {
      viewer.removeAttribute('ios-src');
    }

    // Camera
    if (dish.cameraOrbit) viewer.setAttribute('camera-orbit', dish.cameraOrbit);
    if (dish.cameraTarget) viewer.setAttribute('camera-target', dish.cameraTarget);
    if (dish.fieldOfView) viewer.setAttribute('field-of-view', dish.fieldOfView);

    // Update info overlay
    dishName.textContent = dish.name;
    dishDesc.textContent = dish.description;
    dishPrice.textContent = `$${dish.price}`;

    // Reset quantity
    currentQty = 1;
    qtyCount.textContent = '1';
    updateTotalDisplay();

    // Hotspots
    updateHotspots(dish.hotspots);

    // Animate info
    if (animate) {
      dishName.style.animation = 'none';
      dishName.offsetHeight; // reflow
      dishName.style.animation = 'fadeInUp 0.4s ease-out both';
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // HOTSPOTS
  // ═══════════════════════════════════════════════════════════════
  function updateHotspots(hotspots) {
    // Remove existing hotspots
    viewer.querySelectorAll('.hotspot').forEach(el => el.remove());
    viewer.querySelectorAll('.hotspot-annotation').forEach(el => el.remove());
    openHotspot = null;

    // Add new hotspots
    hotspots.forEach((hs, i) => {
      // Hotspot button
      const btn = document.createElement('button');
      btn.className = 'hotspot';
      btn.setAttribute('slot', `hotspot-${i}`);
      btn.dataset.position = hs.position;
      btn.dataset.normal = hs.normal;
      btn.dataset.visibility = 'visible';
      btn.innerHTML = '<div class="hotspot-dot"></div>';

      // Annotation card
      const card = document.createElement('div');
      card.className = 'hotspot-annotation';
      card.id = `annotation-${i}`;
      card.innerHTML = `
        <div class="hotspot-annotation-title">${hs.name}</div>
        <div class="hotspot-annotation-text">${hs.text}</div>
      `;

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleAnnotation(i, hotspots.length);
      });

      btn.appendChild(card);
      viewer.appendChild(btn);
    });
  }

  function toggleAnnotation(index, total) {
    for (let i = 0; i < total; i++) {
      const card = document.getElementById(`annotation-${i}`);
      if (card) {
        if (i === index && !card.classList.contains('visible')) {
          card.classList.add('visible');
          openHotspot = index;
        } else {
          card.classList.remove('visible');
          if (i === index) openHotspot = null;
        }
      }
    }
  }

  // Close annotations when clicking viewer background
  viewer.addEventListener('click', () => {
    if (openHotspot !== null) {
      const dish = getFilteredItems()[currentDishIndex];
      if (dish) {
        dish.hotspots.forEach((_, i) => {
          const card = document.getElementById(`annotation-${i}`);
          if (card) card.classList.remove('visible');
        });
        openHotspot = null;
      }
    }
  });

  // ═══════════════════════════════════════════════════════════════
  // MODEL LOADING STATE
  // ═══════════════════════════════════════════════════════════════
  viewer.addEventListener('load', () => {
    viewerLoad.classList.add('hidden');
  });
  viewer.addEventListener('error', () => {
    viewerLoad.classList.add('hidden');
  });

  // ═══════════════════════════════════════════════════════════════
  // SWITCH DISH — no page reload
  // ═══════════════════════════════════════════════════════════════
  function switchDish(index) {
    const items = getFilteredItems();
    if (index < 0 || index >= items.length) return;
    currentDishIndex = index;
    renderViewer(items[index]);
    updateCarouselActive();
  }

  // ═══════════════════════════════════════════════════════════════
  // FILTER & CAROUSEL
  // ═══════════════════════════════════════════════════════════════
  function getFilteredItems() {
    if (activeCategory === 'all') return menuItems;
    return menuItems.filter(d => d.category === activeCategory);
  }

  function buildCarousel() {
    const items = getFilteredItems();
    carousel.innerHTML = '';
    items.forEach((dish, i) => {
      const el = document.createElement('div');
      el.className = `carousel-item${i === currentDishIndex ? ' active' : ''}`;
      el.dataset.index = i;
      el.innerHTML = `
        <div class="carousel-thumb">
          <span class="carousel-thumb-emoji">${dish.emoji}</span>
        </div>
        <div class="carousel-item-name">${dish.name}</div>
        <div class="carousel-item-price">$${dish.price}</div>
      `;
      el.addEventListener('click', () => switchDish(i));
      carousel.appendChild(el);
    });
  }

  function updateCarouselActive() {
    carousel.querySelectorAll('.carousel-item').forEach((el, i) => {
      el.classList.toggle('active', i === currentDishIndex);
    });
    // Scroll active item into view
    const active = carousel.querySelector('.carousel-item.active');
    if (active) {
      active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }

  // Category chips
  categoryNav.addEventListener('click', (e) => {
    const chip = e.target.closest('.category-chip');
    if (!chip) return;
    
    categoryNav.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    
    activeCategory = chip.dataset.category;
    currentDishIndex = 0;
    
    const items = getFilteredItems();
    if (items.length > 0) {
      buildCarousel();
      renderViewer(items[0]);
    } else {
      carousel.innerHTML = '<div style="padding:20px;color:var(--text-muted);font-size:0.8rem;">No hay platillos en esta categoría.</div>';
    }
  });

  // ═══════════════════════════════════════════════════════════════
  // QUANTITY
  // ═══════════════════════════════════════════════════════════════
  document.getElementById('qtyMinus').addEventListener('click', () => {
    if (currentQty > 1) {
      currentQty--;
      qtyCount.textContent = currentQty;
      updateTotalDisplay();
    }
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    if (currentQty < 20) {
      currentQty++;
      qtyCount.textContent = currentQty;
      updateTotalDisplay();
    }
  });

  function updateTotalDisplay() {
    const dish = getFilteredItems()[currentDishIndex];
    if (dish) {
      totalValue.textContent = `$${(dish.price * currentQty).toLocaleString('es-MX')}`;
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // ADD TO ORDER
  // ═══════════════════════════════════════════════════════════════
  document.getElementById('addToOrderBtn').addEventListener('click', () => {
    const dish = getFilteredItems()[currentDishIndex];
    if (!dish) return;

    const existing = orderItems.find(o => o.id === dish.id);
    if (existing) {
      existing.qty += currentQty;
    } else {
      orderItems.push({
        id: dish.id,
        name: dish.name,
        emoji: dish.emoji,
        price: dish.price,
        qty: currentQty
      });
    }

    updateCartBadge();
    showToast('✅', `${dish.emoji} ${dish.name} × ${currentQty} agregado`);

    // Reset qty
    currentQty = 1;
    qtyCount.textContent = '1';
    updateTotalDisplay();
  });

  function updateCartBadge() {
    const total = orderItems.reduce((s, o) => s + o.qty, 0);
    cartCount.textContent = total;
    // Bounce animation
    cartBadge.style.animation = 'none';
    cartBadge.offsetHeight;
    cartBadge.style.animation = 'fadeInUp 0.3s ease-out';
  }

  // ═══════════════════════════════════════════════════════════════
  // ORDER DRAWER
  // ═══════════════════════════════════════════════════════════════
  function openOrderDrawer() {
    renderOrderItems();
    orderOverlay.classList.add('open');
    orderDrawer.classList.add('open');
  }
  function closeOrderDrawer() {
    orderOverlay.classList.remove('open');
    orderDrawer.classList.remove('open');
  }

  cartBadge.addEventListener('click', openOrderDrawer);
  orderOverlay.addEventListener('click', closeOrderDrawer);
  orderClose.addEventListener('click', closeOrderDrawer);

  function renderOrderItems() {
    if (orderItems.length === 0) {
      orderBody.innerHTML = `
        <div class="order-empty">
          <div class="order-empty-icon">🍽️</div>
          <p>Tu pedido está vacío.<br>Agrega platillos desde el menú 3D.</p>
        </div>
      `;
      orderTotalV.textContent = '$0';
      return;
    }

    let html = '';
    let grandTotal = 0;
    orderItems.forEach((item, idx) => {
      const subtotal = item.price * item.qty;
      grandTotal += subtotal;
      html += `
        <div class="order-item">
          <span class="order-item-emoji">${item.emoji}</span>
          <div class="order-item-info">
            <div class="order-item-name">${item.name}</div>
            <div class="order-item-price">$${item.price} c/u</div>
          </div>
          <span class="order-item-qty">×${item.qty}</span>
          <button class="order-item-remove" data-idx="${idx}" aria-label="Eliminar">✕</button>
        </div>
      `;
    });
    orderBody.innerHTML = html;
    orderTotalV.textContent = `$${grandTotal.toLocaleString('es-MX')}`;

    // Remove buttons
    orderBody.querySelectorAll('.order-item-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        orderItems.splice(idx, 1);
        updateCartBadge();
        renderOrderItems();
      });
    });
  }

  // WhatsApp confirm
  orderConfirm.addEventListener('click', () => {
    if (orderItems.length === 0) {
      showToast('⚠️', 'Agrega platillos primero');
      return;
    }
    const PHONE = '523321222772';
    let msg = '🍽️ *Pedido desde Menú 3D AR — ALEX*\n\n';
    let total = 0;
    orderItems.forEach(item => {
      const sub = item.price * item.qty;
      total += sub;
      msg += `${item.emoji} *${item.name}* × ${item.qty} — $${sub.toLocaleString('es-MX')}\n`;
    });
    msg += `\n💰 *Total: $${total.toLocaleString('es-MX')}*`;
    msg += '\n\n📲 Enviado desde la experiencia WebAR 3D';

    const url = `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
    closeOrderDrawer();
  });

  // ═══════════════════════════════════════════════════════════════
  // AR BUTTON — programmatic AR activation
  // ═══════════════════════════════════════════════════════════════
  arFab.addEventListener('click', () => {
    if (viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      showToast('📱', 'Abre en tu celular para usar AR');
    }
  });

  // ═══════════════════════════════════════════════════════════════
  // TOAST
  // ═══════════════════════════════════════════════════════════════
  let toastTimer = null;
  function showToast(icon, text) {
    if (toastTimer) clearTimeout(toastTimer);
    toastIcon.textContent = icon;
    toastText.textContent = text;
    toast.classList.add('show');
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // ═══════════════════════════════════════════════════════════════
  // KEYBOARD NAVIGATION
  // ═══════════════════════════════════════════════════════════════
  document.addEventListener('keydown', (e) => {
    const items = getFilteredItems();
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      switchDish((currentDishIndex + 1) % items.length);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      switchDish((currentDishIndex - 1 + items.length) % items.length);
    }
  });

  // ═══════════════════════════════════════════════════════════════
  // SWIPE GESTURE on viewer
  // ═══════════════════════════════════════════════════════════════
  let swipeStartX = 0;
  let swipeStartY = 0;
  const viewerSection = document.querySelector('.viewer-section');

  viewerSection.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
    }
  }, { passive: true });

  viewerSection.addEventListener('touchend', (e) => {
    if (e.changedTouches.length === 1) {
      const dx = e.changedTouches[0].clientX - swipeStartX;
      const dy = e.changedTouches[0].clientY - swipeStartY;
      // Only horizontal swipes (not 3D rotation gestures)
      if (Math.abs(dx) > 80 && Math.abs(dy) < 50) {
        const items = getFilteredItems();
        if (dx < 0) {
          // swipe left → next
          switchDish((currentDishIndex + 1) % items.length);
        } else {
          // swipe right → prev
          switchDish((currentDishIndex - 1 + items.length) % items.length);
        }
      }
    }
  }, { passive: true });

  // ═══════════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════════
  function init() {
    buildCarousel();
    if (menuItems.length > 0) {
      renderViewer(menuItems[0], false);
    }
  }

  init();
</script>
</body>
</html>
